<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>NavegAItor · CrAIthon</title>
<style>
:root{--bg:#050506;--fg:#f2f2f4;--mut:#8b8b95;--line:#23232a;--card:#0e0e12;--g:linear-gradient(90deg,#5fcbee,#8fe6a8,#fdf969,#f2884a,#ea44c6,#b347e8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fafafa;--fg:#0b0b0d;--mut:#666670;--line:#e2e2e8;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header,footer{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;font-size:14px;color:var(--mut)}
header a,footer a{color:var(--mut);text-decoration:none;margin-left:18px}
header a:hover,footer a:hover{color:var(--fg)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{height:54px;width:auto;border-radius:6px;display:block}
.robot{height:64px;width:auto;border-radius:6px;display:block;margin-left:10px}
.brand{display:flex;align-items:center}
.hero{width:170px;max-width:50vw;border-radius:14px;margin-bottom:22px;box-shadow:0 0 60px rgba(61,90,254,.25)}
.wm{width:min(560px,86vw);height:auto;display:block;margin:0 auto}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:18px}
h1{font-size:clamp(40px,8vw,76px);margin:0 0 10px;letter-spacing:-.03em;font-weight:700}
h1 span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--mut);margin:0 0 34px;font-size:clamp(15px,2.2vw,18px)}
form{width:min(680px,100%);position:relative}
.box{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 22px;transition:.2s}
.box:focus-within{border-color:transparent;box-shadow:0 0 0 1.5px #3d5afe,0 0 40px rgba(61,90,254,.3)}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font-size:17px;padding:12px 0}
button{border:0;cursor:pointer;border-radius:999px;background:var(--g);color:#050506;font-weight:600;font-size:15px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.badge{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--mut)}
.badge b{color:var(--fg);font-weight:500}
#res{width:min(680px,100%);margin-top:28px;text-align:left;display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--mut);font-size:15px;line-height:1.55}
.card strong{color:var(--fg)}
.card h2{margin:0 0 6px;font-size:18px;color:var(--fg)}
.card a.src{color:#5fcbee;font-size:13px;text-decoration:none;word-break:break-all}
.card a.src:hover{text-decoration:underline}
.card .desc{margin:10px 0 0;font-style:italic}
.card .texto{margin-top:14px;white-space:pre-wrap;color:var(--fg);opacity:.85;max-height:46vh;overflow:auto}
.card.err{color:#ff8a8a}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:#5fcbee;display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.tog{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 12px;font-size:13px;font-weight:500}
.brand-col{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--mut);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.icon-btn:hover{color:var(--fg);border-color:#3d5afe}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;height:100%;width:300px;max-width:85vw;background:var(--card);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .25s ease;z-index:70;display:flex;flex-direction:column;padding:18px 16px;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sidebar.open{transform:translateX(0)}
.sidebar h2{font-size:15px;margin:0 0 14px;color:var(--fg);display:flex;justify-content:space-between;align-items:center}
.sidebar h2 button{background:none;border:0;color:var(--mut);font-size:20px;width:28px;height:28px;border-radius:8px;cursor:pointer;padding:0}
.sidebar h2 button:hover{color:var(--fg);background:var(--line)}
.hist-empty{color:var(--mut);font-size:13px}
.hist-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;flex:1}
.hist-list li{border-radius:10px;overflow:hidden}
.hist-list a{display:block;padding:9px 10px;text-decoration:none;color:var(--fg);font-size:13px}
.hist-list a:hover{background:var(--line)}
.hist-list .host{font-weight:600;display:block}
.hist-list .full{color:var(--mut);font-size:11px;display:block;word-break:break-all;margin-top:2px}
.clear-hist{margin-top:14px;align-self:flex-start;background:none;border:1px solid var(--line);color:var(--mut);width:34px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.clear-hist:hover{color:#ff8a8a;border-color:#ff8a8a}
</style>
</head>

<script>
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Pega aquí la URL de Render cuando el backend esté desplegado,
// por ejemplo: "https://navegaitor-backend.onrender.com"
const API_URL = "https://navegaitor.onrender.com";

// --- Historial (guardado solo en este navegador) ---
function cargarHistorial(){
  try{ return JSON.parse(localStorage.getItem('navegaitor_historial')||'[]'); }catch(e){ return []; }
}
function guardarEnHistorial(url){
  try{
    let lista=cargarHistorial();
    lista=lista.filter(it=>it.url!==url);
    lista.unshift({url, fecha:Date.now()});
    localStorage.setItem('navegaitor_historial', JSON.stringify(lista.slice(0,50)));
  }catch(e){}
}
function pintarHistorial(){
  const cont=document.getElementById('histList');
  const lista=cargarHistorial();
  if(!lista.length){
    cont.innerHTML='<p class="hist-empty">Todavía no hay enlaces en el historial.</p>';
    return;
  }
  cont.innerHTML=lista.map(it=>{
    let host; try{ host=new URL(it.url).hostname.replace(/^www\./,''); }catch(e){ host=it.url; }
    return '<li><a href="'+esc(it.url)+'" class="hist-open" data-url="'+esc(it.url)+'"><span class="host">'+esc(host)+'</span><span class="full">'+esc(it.url)+'</span></a></li>';
  }).join('');
}
const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
function abrirHistorial(){ pintarHistorial(); sidebar.classList.add('open'); overlay.classList.add('show'); }
function cerrarHistorial(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
document.getElementById('histToggle').addEventListener('click',abrirHistorial);
document.getElementById('histClose').addEventListener('click',cerrarHistorial);
overlay.addEventListener('click',cerrarHistorial);
document.getElementById('histClear').addEventListener('click',()=>{
  try{ localStorage.removeItem('navegaitor_historial'); }catch(e){}
  pintarHistorial();
});

function normalizaEnlace(v){
  v=v.trim();
  if(!v)return null;
  if(!/^https?:\/\//i.test(v)) v='https://'+v;
  try{ return new URL(v).toString(); }catch(e){ return null; }
}

document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();
  const raw=document.getElementById('q').value;
  const url=normalizaEnlace(raw);
  const r=document.getElementById('res');

  if(!url){
    r.style.display='block';
    r.innerHTML='<div class="card err">Eso no parece un enlace válido. Prueba con algo como <b>https://ejemplo.com</b>.</div>';
    return;
  }

  guardarEnHistorial(url);

  // Abre la web directamente, en esta misma pestaña (no una nueva).
  window.location.href=url;
});
</script>
